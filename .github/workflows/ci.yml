name: Run tests

on:
  push:
    paths-ignore: ["**.md", LICENSE]
  pull_request:
    paths-ignore: ["**.md", LICENSE]
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Installua
        id: installua
        uses: ./

      - name: Check outputs and env
        shell: bash
        env:
          OUT_VERSION: ${{ steps.installua.outputs.version }}
          OUT_NSIS_VERSION: ${{ steps.installua.outputs.nsis-version }}
          OUT_NSISDIR: ${{ steps.installua.outputs.nsisdir }}
        run: |
          set -euo pipefail
          [ -n "$OUT_VERSION" ]
          [ -n "$OUT_NSIS_VERSION" ]
          [ "$OUT_NSISDIR" = "$NSISDIR" ]

          # Unqualified: proves the action put both bin dirs on PATH
          installua --version | grep -q "$OUT_VERSION"
          makensis -VERSION

      - name: Build an installer
        shell: bash
        run: |
          set -euo pipefail
          cat > test.lua <<'EOF'
          attributes {
          	name = "test",
          	outFile = "test.exe",
          }

          installer {
          	section("Core", function()
          		detailPrint("hello")
          	end),
          }
          EOF
          installua build test.lua
          [ -f test.exe ]

  pinned-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Installua
        id: installua
        uses: ./
        with:
          version: "0.1.0"
          nsis-version: "3.12"

      - name: Check the pinned versions were used
        shell: bash
        run: |
          set -euo pipefail
          [ "${{ steps.installua.outputs.version }}" = "0.1.0" ]
          installua --version | grep -q 0.1.0
          makensis -VERSION | grep -q 3.12

  old-nsis-rejected:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Installua against NSIS older than 3.12
        id: installua
        continue-on-error: true
        uses: ./
        with:
          nsis-version: "3.10"

      - name: Check the step failed
        shell: bash
        run: '[ "${{ steps.installua.outcome }}" = failure ]'
